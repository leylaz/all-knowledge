<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* Dark by default; a saved choice from the header switch wins. */
  (function () { var t = "dark"; try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" || t === "pink" ? t : "dark"); })();
</script>
<style>
:root {
  --paper: #F3F5F9; --surface: #FFFFFF; --ink: #121A27; --muted: #566278;
  --rule: #D4DBE6; --trace: #1F4E9C; --trace-soft: #E2EAF7; --pad: #A97F16;
  --pad-soft: #F7EFD9; --code-bg: #E8EDF5; --code-comment: #2B7A4B; --redirect: #B5322E;
  --accent-red: #B5322E; --accent-green: #1F7A57;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="pink"]) {
    --paper: #080D14; --surface: #0F1723; --ink: #E4EBF4; --muted: #95A4B8;
    --rule: #223249; --trace: #7FA8F0; --trace-soft: #16243B; --pad: #D1AE55;
    --pad-soft: #1B1810; --code-bg: #0C1420; --code-comment: #6FCB98; --redirect: #EE6B6B;
    --accent-red: #EE6B6B; --accent-green: #4FC28F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #080D14; --surface: #0F1723; --ink: #E4EBF4; --muted: #95A4B8;
  --rule: #223249; --trace: #7FA8F0; --trace-soft: #16243B; --pad: #D1AE55;
  --pad-soft: #1B1810; --code-bg: #0C1420; --code-comment: #6FCB98; --redirect: #EE6B6B;
  --accent-red: #EE6B6B; --accent-green: #4FC28F; color-scheme: dark;
}
:root[data-theme="pink"] {
  /* Pastel palette after a Notion "pastel dashboard": blush, lavender, sky,
     sage, aqua, peach, and cream on white, with Notion's warm ink. Text
     colors are a shade darker than the swatches to keep 4.5:1 contrast. */
  --paper: #FFFAFB; --surface: #FFFFFF; --ink: #37352F; --muted: #6B6964;
  --rule: #EFE3E8; --trace: #B03F7C; --trace-soft: #FFDFE3; --pad: #7E55A0;
  --pad-soft: #F6F3F8; --code-bg: #F7F5E6; --code-comment: #3B7556; --redirect: #C23A55;
  --accent-red: #C23A55; --accent-green: #3B7556; color-scheme: light;
  --p-blush: #FFDFE3; --p-heart: #FF6A7E; --p-lav: #DFDDFB; --p-lilac: #E7E7F7; --p-sky: #D2E9F9;
  --p-ice: #E6F5FF; --p-aqua: #DFF8FA; --p-sage: #EDF3EC; --p-mint: #A5D6A7; --p-peach: #FBE8E3;
  --p-cream: #F4F2DF; --p-orchid: #D1B7EC;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--trace); }
:focus-visible { outline: 2px solid var(--pad); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

header.top { border-bottom: 1px solid var(--rule); background: var(--paper); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.menu-btn { display: none; font: inherit; font-size: .92rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.search { margin-left: auto; flex: 1 1 200px; max-width: 320px; }
.search input { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
.search input::placeholder { color: var(--muted); }

.intro { padding: 48px 0 28px; }
.intro h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.02; letter-spacing: -0.035em; margin: 0 0 12px; font-weight: 700; }
.intro p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 1.05rem; }

.die { border: 2px dashed var(--pad); padding: 14px; border-radius: 4px; margin-bottom: 56px; }
.floor { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr);
  grid-template-areas:
    "fab fab fab fab fab fab"
    "circ circ circ isa isa isa"
    "pipe pipe pipe pipe pipe pipe"
    "core core core mem mem mem"
    "core core core ctr ctr ctr"
    "coh coh coh icx icx icx"
    "os os os comp comp comp"
    "conc conc conc perf perf perf"
    "eda eda eda verif verif verif"
    "nn nn nn gen gen gen"
    "llm llm llm llm llm llm"
    "intv intv intv intv intv intv"
    "p1 p1 p1 p1 p1 p1"
    "p2 p2 p2 p2 p2 p2"; }
.block { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--trace); border-radius: 3px; padding: 16px 18px 18px; transition: opacity .2s; }
.block.dim { opacity: .35; }
.floor .block:nth-child(4n+2) { border-top-color: var(--accent-green); }
.floor .block:nth-child(4n+3) { border-top-color: var(--accent-red); }
.floor .block:nth-child(4n+4) { border-top-color: var(--pad); }
.block h2 { margin: 0 0 2px; font-size: 1.15rem; letter-spacing: -0.01em; }
.block h2 a { color: var(--ink); text-decoration: none; }
.block h2 a:hover { color: var(--trace); }
.block .cap { margin: 0 0 12px; color: var(--muted); font-size: .88rem; }
.block ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.block li a { display: inline-block; text-decoration: none; color: var(--ink); background: var(--trace-soft); border-radius: 3px; padding: 5px 10px; font-size: .92rem; }
.block li a:hover { background: var(--trace); color: var(--surface); }
.block li.hide { display: none; }
.empty { color: var(--muted); margin: -36px 0 48px; }
.results { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 18px 4px; margin: 0 0 28px; }
.results h2 { margin: 0 0 8px; font-size: 1rem; color: var(--muted); font-weight: 600; }
.results ol { list-style: none; margin: 0; padding: 0; }
.results li { padding: 8px 0; border-top: 1px solid var(--rule); }
.results li a { font-weight: 600; text-decoration: none; }
.results li p { margin: 2px 0 0; font-family: var(--serif); font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.results mark { background: var(--pad-soft); color: var(--ink); border-radius: 2px; padding: 0 1px; }
.results .more { color: var(--muted); font-size: .88rem; }

/* Calculators */
.calc { font-family: var(--sans); font-size: .9rem; line-height: 1.45; background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--pad); border-radius: 4px; padding: 14px 16px 6px; margin: 4px 0 20px; }
.calc .calc-title { font-weight: 700; font-size: 1rem; margin: 0 0 2px; }
.calc .calc-intro { color: var(--muted); margin: 0 0 10px; }
.calc-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 16px; margin: 0 0 12px; }
.calc fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.calc legend { font-weight: 600; color: var(--pad); padding: 0; margin-bottom: 4px; }
.calc label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
.calc label span { color: var(--muted); }
.calc input { width: 84px; flex: none; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; text-align: right; }
.calc table { margin: 0 0 10px; }
.calc tr.hot td { background: var(--pad-soft); font-weight: 600; }
.calc p { margin: 0 0 8px; }
.calc .calc-out { font-size: .95rem; }

/* Pipeline trace viewer */
.trace { font-family: var(--sans); font-size: .9rem; line-height: 1.45; background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--trace); border-radius: 4px; padding: 14px 16px 6px; margin: 4px 0 20px; }
.trace p { margin: 0 0 8px; }
.trace .calc-title { font-weight: 700; font-size: 1rem; margin: 0 0 2px; }
.trace .calc-intro { color: var(--muted); }
.trace .calc-form { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 8px; }
.trace .calc-form label { display: flex; align-items: center; gap: 8px; }
.trace .calc-form span { color: var(--muted); }
.trace .calc-form input { width: 64px; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; text-align: right; }
.trace-step { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
.trace-step span { flex: none; min-width: 6.5em; }
.trace-step input { flex: 1; min-width: 0; accent-color: var(--trace); }
.trace-scroll { overflow-x: auto; margin: 0 0 8px; }
.body .trace table { width: auto; border-collapse: collapse; font-family: var(--mono); font-size: .74rem; }
.body .trace th, .body .trace td { padding: 2px 0; min-width: 16px; text-align: center; border-bottom: 1px solid var(--rule); }
.body .trace td:nth-child(-n+2), .body .trace th:nth-child(-n+2) { text-align: left; padding-right: 8px; white-space: nowrap; }
.body .trace td code { background: none; padding: 0; font-size: inherit; }
.trace .f { color: var(--muted); } .trace .r { color: var(--trace); font-weight: 700; } .trace .w { color: var(--muted); }
.trace .x { background: var(--trace-soft); color: var(--trace); font-weight: 700; }
.trace .m { background: var(--pad-soft); color: var(--pad); font-weight: 700; }
.trace .d { color: var(--muted); } .trace .c { color: var(--accent-green); font-weight: 700; }
.body .trace .now { outline: 1px solid var(--pad); outline-offset: -1px; }
.trace-key { color: var(--muted); font-size: .82rem; }
.trace-key b { font-family: var(--mono); margin-left: 8px; padding: 0 3px; border-radius: 2px; }

/* Glossary hover cards */
.gl { position: relative; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
.gl-card { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-left: 3px solid var(--trace); border-radius: 4px; padding: 8px 12px; font-family: var(--sans); font-size: .86rem; font-weight: 400; line-height: 1.45; text-align: left; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.gl-card::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 8px; }
.gl:hover .gl-card, .gl:focus .gl-card, .gl:focus-within .gl-card { display: block; }
.gl-card a { white-space: nowrap; }

/* Page layout with side menu */
.page { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; padding-top: 28px; padding-bottom: 64px; }
.side { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; font-size: .92rem; padding-right: 4px; }
.side .grp { margin-bottom: 16px; }
.side .rg { display: block; font-weight: 600; color: var(--ink); text-decoration: none; padding: 4px 8px; border-left: 2px solid var(--rule); }
.side ul { list-style: none; margin: 2px 0 0; padding: 0; }
.side li a { display: block; color: var(--muted); text-decoration: none; padding: 3px 8px 3px 18px; border-left: 2px solid var(--rule); }
.side a:hover { color: var(--trace); }
.side a.cur { color: var(--trace); border-left-color: var(--trace); font-weight: 600; }
.side .subsec { margin: 2px 0 6px; }
.side .subsec li a { padding-left: 32px; font-size: .86rem; }
.side .subsec li.grp-label { padding: 8px 8px 2px 32px; border-left: 2px solid var(--rule); font-size: .74rem; font-weight: 600; color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -8px 0 28px; font-size: .9rem; }
.toc span { color: var(--muted); }
.toc a { text-decoration: none; background: var(--trace-soft); color: var(--ink); border-radius: 3px; padding: 4px 10px; }
.toc a:hover { background: var(--trace); color: var(--surface); }
.practice { scroll-margin-top: 16px; }
.body h3[id] { scroll-margin-top: 16px; }
.side .home { display: block; margin-bottom: 18px; text-decoration: none; }

.note { max-width: 70ch; min-width: 0; }
.region { color: var(--trace); font-weight: 600; font-size: .95rem; margin: 0 0 6px; }
.note h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 24px; }
.body { font-family: var(--serif); font-size: 1.06rem; line-height: 1.68; }
.body h3 { font-family: var(--sans); font-size: 1.05rem; margin: 30px 0 6px; letter-spacing: -0.005em; }
.body p { margin: 0 0 14px; }
.body .eq { font-family: var(--sans); font-size: 1.02rem; background: var(--code-bg); border-radius: 4px; padding: 10px 14px; margin: 0 0 14px; overflow-x: auto; line-height: 1.3; white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 4px; }
.frac > span { padding: 1px 4px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; }
.body ul, .body ol { padding-left: 1.2em; margin: 0 0 14px; }
.body .refs { font-family: var(--sans); font-size: .86rem; color: var(--muted); }
.body h4 { font-family: var(--sans); font-size: .98rem; margin: 24px 0 6px; }
.body h4[id] { scroll-margin-top: 16px; }
.bookref { font-size: .86rem; color: var(--muted); margin: -12px 0 24px; }
.body .callout { font-family: var(--sans); font-size: .93rem; line-height: 1.55; background: var(--trace-soft); border-left: 3px solid var(--trace); border-radius: 3px; padding: 10px 14px; margin: 0 0 16px; }
.body li { margin-bottom: 6px; }
.body code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.body pre { background: var(--code-bg); padding: 14px 16px; border-radius: 4px; overflow-x: auto; font-size: .84rem; line-height: 1.55; margin: 0 0 16px; }
.body pre code { background: none; padding: 0; font-size: inherit; }
.body pre code .cm { color: var(--code-comment); }
.tbl { overflow-x: auto; margin: 0 0 16px; }
.tbl td ul { margin: 0; }
.body table { border-collapse: collapse; font-family: var(--sans); font-size: .9rem; width: 100%; }
.body th, .body td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.body th { font-weight: 600; }

/* Practice */
.practice { background: var(--pad-soft); border: 1px solid var(--pad); border-radius: 4px; padding: 18px 20px 6px; margin: 40px 0 36px; }
.practice > h2 { margin: 0 0 4px; font-size: 1.15rem; }
.practice > p { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.practice h3 { font-size: .98rem; margin: 18px 0 8px; }
.prob { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; margin-bottom: 12px; }
.prob .q { font-family: var(--serif); font-size: 1rem; line-height: 1.6; }
.prob .q p { margin: 0 0 8px; }
.prob details { margin-top: 6px; }
.prob summary { cursor: pointer; color: var(--trace); font-weight: 600; font-size: .92rem; }
.prob .a { font-family: var(--serif); font-size: .98rem; line-height: 1.62; padding-top: 8px; }
.prob .a p { margin: 0 0 10px; }
.prob .a ol, .prob .a ul { padding-left: 1.2em; margin: 0 0 10px; }
.prob code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.prob pre { background: var(--code-bg); padding: 10px 12px; border-radius: 4px; overflow-x: auto; font-size: .82rem; }
.prob pre code { background: none; padding: 0; }
.prob .qn { font-family: var(--sans); font-size: .8rem; font-weight: 700; color: var(--pad); letter-spacing: .04em; margin: 0 0 4px; }
.flag-btn { float: right; font: inherit; font-size: .78rem; font-weight: 600; letter-spacing: 0; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 10px; padding: 1px 9px; cursor: pointer; }
.flag-btn:hover { color: var(--pad); border-color: var(--pad); }
.flag-btn[aria-pressed="true"] { color: var(--pad); border-color: var(--pad); background: var(--pad-soft); }
.flag-note { color: var(--muted); font-size: .92rem; margin: -12px 0 24px; }
.solve-btn { display: block; margin: 8px 0 0 auto; font: inherit; font-family: var(--sans); font-size: .78rem; font-weight: 600; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 10px; padding: 1px 9px; cursor: pointer; }
.solve-btn:hover { color: var(--accent-green); border-color: var(--accent-green); }
.solve-btn[aria-pressed="true"] { color: var(--accent-green); border-color: var(--accent-green); }
.drill-bar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 16px; margin: 0 0 20px; font-size: .9rem; }
.drill-bar label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.drill-bar label.chk { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 7px; }
.drill-bar select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
.drill-src { font-family: var(--sans); font-size: .9rem; color: var(--muted); }
.prob .lvl { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px; font-size: .72rem; font-weight: 600; letter-spacing: 0; border: 1px solid currentColor; vertical-align: 1px; }
.prob .lvl.easy { color: var(--accent-green); }
.prob .lvl.medium { color: var(--trace); }
.prob .lvl.hard { color: var(--accent-red); }
.body .prob { margin-bottom: 14px; }

.pager { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); margin-top: 40px; padding-top: 18px; font-size: .95rem; }
.pager a { text-decoration: none; }
.pager .next { margin-left: auto; text-align: right; }
.pager small { display: block; color: var(--muted); font-size: .8rem; }
.sublist { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 24px; padding: 0; list-style: none; }
.sublist a { display: inline-block; text-decoration: none; color: var(--ink); background: var(--trace-soft); border-radius: 3px; padding: 5px 10px; font-size: .92rem; font-family: var(--sans); }


/* Bit-field bars for the Floating-Point Units page */
.bfs { margin: 4px 0 18px; }
.bfrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; margin: 0 0 6px; }
.bfrow b { font-family: var(--mono); font-size: .78rem; font-weight: 500; color: var(--muted); }
.bf { display: flex; min-width: min-content; font-family: var(--mono); font-size: .74rem; border-radius: 3px; overflow: hidden; border: 1px solid var(--rule); }
.bf span { flex-basis: 0; min-width: 16px; padding: 3px 2px; text-align: center; white-space: nowrap; overflow: hidden; color: var(--ink); }
.bf .s { background: var(--pad-soft); color: var(--pad); font-weight: 600; }
.bf .e { background: var(--trace-soft); color: var(--trace); font-weight: 600; border-left: 1px solid var(--rule); }
.bf .f { background: var(--code-bg); border-left: 1px solid var(--rule); }
.bf .x { background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--code-bg) 4px 8px); color: var(--muted); border-left: 1px dashed var(--rule); }
.bfkey { font-size: .82rem; color: var(--muted); margin: 0 0 18px; }
.bfkey i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }

/* Clickable diagrams */
.fp-fig { margin: 0 0 28px; }
.fp-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.fp { display: block; width: 100%; min-width: 680px; height: auto; font-family: var(--sans); }
.pl { min-width: 600px; }
.fp text { pointer-events: none; }
.fp text:not([text-anchor]) { text-anchor: middle; }
.fp .die-edge { fill: none; stroke: var(--pad); stroke-width: 2; stroke-dasharray: 7 5; }
.fp .core0 { fill: none; stroke: var(--rule); stroke-width: 1.5; }
.fp .fp-title text { text-anchor: start; font-size: 14px; font-weight: 600; fill: var(--trace); pointer-events: auto; }
.fp .fp-title:hover text { text-decoration: underline; }
.fp .slice { stroke: var(--pad); stroke-width: 1; stroke-dasharray: 3 4; opacity: .6; pointer-events: none; }
.fpb { cursor: pointer; }
.fpb .b { stroke-width: 1.5; transition: fill .15s; }
.fpb .l { font-size: 14px; font-weight: 600; fill: var(--ink); }
.fpb .s { font-size: 11.5px; fill: var(--muted); }
.fpb .p { font-size: 11.5px; fill: var(--ink); }
.fpb .big { font-size: 22px; font-weight: 700; fill: var(--trace); letter-spacing: -.02em; }
.fpb .g { fill: var(--trace-soft); stroke: none; }
.fpb.core .b { fill: var(--trace-soft); stroke: var(--trace); }
.fpb.mem .b { fill: var(--pad-soft); stroke: var(--pad); }
.fpb.io .b, .fpb.ghost .b { fill: var(--surface); stroke: var(--muted); }
.fpb.preg .b { fill: var(--pad); stroke: var(--pad); }
.fpb.core:hover .b, .fpb.core:focus-visible .b { fill: var(--trace); }
.fpb.mem:hover .b, .fpb.mem:focus-visible .b { fill: var(--pad); }
.fpb.io:hover .b, .fpb.io:focus-visible .b, .fpb.ghost:hover .b, .fpb.ghost:focus-visible .b { fill: var(--muted); }
.fpb:hover text, .fpb:focus-visible text { fill: var(--surface); }
.fpb.preg:hover .b { fill: var(--ink); stroke: var(--ink); }
.fpb.preg:hover text { fill: var(--ink); }
.fpb.ghost:hover .g { fill: var(--surface); opacity: .25; }
.fpb:focus-visible { outline: none; }
.fpb:focus-visible .b { stroke: var(--ink); stroke-width: 2.5; }
.plp { cursor: pointer; }
.plp .hit { fill: none; stroke: transparent; stroke-width: 16; }
.plp .ln { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
.plp.fwd .ln { stroke: var(--trace); }
.plp.redir .ln { stroke: var(--redirect); stroke-dasharray: 7 4; }
.plp:hover .ln, .plp:focus-visible .ln { stroke-width: 4; }
.plp:focus-visible { outline: none; }
.pl-lab { font-size: 12px; font-weight: 600; }
.pl-lab.fwd { fill: var(--trace); }
.pl-lab.redir { fill: var(--redirect); }
.plp:hover .pl-lab { text-decoration: underline; }
.ah.fwd { fill: var(--trace); } .ah.redir { fill: var(--redirect); } .ah.aux { fill: var(--muted); }
.aux-ln { fill: none; stroke: var(--muted); stroke-width: 1.5; pointer-events: none; }
.fp .pl-key text:not([text-anchor]) { text-anchor: start; }
.pl-key text { font-size: 11.5px; fill: var(--muted); }
.pl-key .hint { text-anchor: end; }
.pl-key .k-stage { fill: var(--trace-soft); stroke: var(--trace); }
.pl-key .k-reg { fill: var(--pad); }
.pl-key .k-fwd { stroke: var(--trace); stroke-width: 2.5; }
.pl-key .k-redir { stroke: var(--redirect); stroke-width: 2.5; stroke-dasharray: 5 3; }
.fp-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-top: 10px; font-size: .86rem; color: var(--muted); }
.fp-legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
.fp-legend .sw.core { background: var(--trace-soft); border-color: var(--trace); }
.fp-legend .sw.mem { background: var(--pad-soft); border-color: var(--pad); }
.fp-legend .sw.io { background: var(--surface); border-color: var(--muted); }
.fp-legend .hint { margin-left: auto; }
@media (max-width: 860px) { .fp-legend .hint { margin-left: 0; flex-basis: 100%; } }


/* Chip floorplan (fixed dark palette) */
.chip { min-width: 760px; }
.chip .core-edge { fill: #0D141D; stroke: #2E4257; stroke-width: 1; }
.chip .dblk { cursor: pointer; }
.chip .dblk .b { stroke-width: 1.2; transition: filter .15s; }
.chip .tex { pointer-events: none; }
.chip .dl { font-size: 12.5px; font-weight: 600; fill: #EEF3F9; }
.chip .dl.sm { font-size: 11px; }
.chip .ds { font-size: 10.5px; fill: #B9C6D6; }
.chip .dblk:hover .b, .chip .dblk:focus-visible .b { filter: brightness(1.45) saturate(1.1); }
.chip .dblk:focus-visible .b { stroke: #FFFFFF; stroke-width: 2; }
.chip .dblk:focus-visible, .chip .dghost:focus-visible, .chip a:focus-visible { outline: none; }
.chip .dghost { cursor: pointer; }
.chip .dghost .gl { opacity: .5; transition: opacity .15s; }
.chip .dghost:hover .gl, .chip .dghost:focus-visible .gl { opacity: .85; }
.chip .dghost:focus-visible .core-edge { stroke: #FFFFFF; }
.chip .gname { font-size: 12px; font-weight: 700; fill: #DCE5EF; letter-spacing: .04em; }
.chip .core-tag text { font-size: 10.5px; font-weight: 700; fill: #8FB4E8; letter-spacing: .08em; pointer-events: auto; }
.chip .core-tag:hover text { fill: #FFFFFF; }
.chip .pins rect { fill: #C9A54A; stroke: #8A6E25; stroke-width: .8; }
.chip .ext { cursor: pointer; }
.chip .ext-ln { stroke: #C2503F; stroke-width: 2.5; fill: none; }
.chip .ext-t { font-size: 15px; font-weight: 600; fill: var(--ink); }
.chip .ext-t.sm { font-size: 13px; fill: var(--muted); }
.chip .ext:hover .ext-t { fill: #C2503F; }
.chip-legend .sw { border-width: 1.5px; }


/* Header theme switch */
.theme-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .88rem; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
.theme-btn:hover { border-color: var(--trace); color: var(--trace); }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Chip zoom bar */
.chip-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 10px; font-size: .86rem; color: var(--muted); }
.chip-zoom { font: inherit; font-size: .88rem; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.chip-zoom:hover { border-color: var(--trace); color: var(--trace); }
.chip-zoom[aria-pressed="true"] { background: var(--trace-soft); border-color: var(--trace); }
svg.chip { touch-action: pan-x pan-y; }
/* Pink theme: pastel dashboard look */
[data-theme="pink"] .intro h1, [data-theme="pink"] .note h1, [data-theme="pink"] .block h2,
[data-theme="pink"] .stack-fig h2, [data-theme="pink"] .practice > h2 { font-family: var(--mono); font-weight: 500; letter-spacing: -0.02em; }
[data-theme="pink"] .die { border: 0; background: var(--p-blush); border-radius: 14px; }
[data-theme="pink"] .block, [data-theme="pink"] .floor .block:nth-child(n) { border: 1px solid var(--rule); border-radius: 10px; }
[data-theme="pink"] .floor .block:nth-child(7n+1) { background: var(--p-cream); }
[data-theme="pink"] .floor .block:nth-child(7n+2) { background: var(--p-lav); }
[data-theme="pink"] .floor .block:nth-child(7n+3) { background: var(--p-sky); }
[data-theme="pink"] .floor .block:nth-child(7n+4) { background: var(--p-ice); }
[data-theme="pink"] .floor .block:nth-child(7n+5) { background: var(--p-aqua); }
[data-theme="pink"] .floor .block:nth-child(7n+6) { background: var(--p-peach); }
[data-theme="pink"] .floor .block:nth-child(7n+7) { background: var(--p-lilac); }
[data-theme="pink"] .block li a { background: rgba(255, 255, 255, .75); }
[data-theme="pink"] .block li a:hover { background: var(--trace); color: #FFFFFF; }
[data-theme="pink"] .block .cap { color: #5F5D58; }
[data-theme="pink"] .practice { border: 0; background: var(--pad-soft); border-radius: 10px; }
[data-theme="pink"] .prob, [data-theme="pink"] .layer { border-radius: 8px; }
[data-theme="pink"] .layer { --edge: var(--p-mint); }
[data-theme="pink"] .layer.sys { --edge: var(--p-heart); }
[data-theme="pink"] .layer.design { --edge: #A99BE0; }
[data-theme="pink"] .layer:not(.nolink):hover, [data-theme="pink"] .layer:focus-within { background: var(--p-blush); }
[data-theme="pink"] .lyr-size { color: var(--ink); }
[data-theme="pink"] .stack-key i { background: var(--p-mint); }
[data-theme="pink"] .stack-key i.sys { background: var(--p-heart); }
[data-theme="pink"] .stack-key i.design { background: #A99BE0; }
[data-theme="pink"] .fpb.preg .b { fill: var(--p-orchid); stroke: var(--p-orchid); }
[data-theme="pink"] .pl-key .k-reg { fill: var(--p-orchid); }
/* Pink theme: the chip in pastels */
[data-theme="pink"] .chip .die-bg { fill: #FFFFFF; stroke: #EADDE3; }
[data-theme="pink"] .chip .core-edge { fill: #FFF7F9; stroke: #EADDE3; }
[data-theme="pink"] .chip .g-fe { fill: #D2E9F9; stroke: #7FB3DE; }
[data-theme="pink"] .chip .g-ooo { fill: #E3F2E3; stroke: #8CC690; }
[data-theme="pink"] .chip .g-fp { fill: #FFDFE3; stroke: #F28A9B; }
[data-theme="pink"] .chip .g-lsu { fill: #DFF8FA; stroke: #7ACAD2; }
[data-theme="pink"] .chip .g-sram { fill: #DFDDFB; stroke: #A99BE0; }
[data-theme="pink"] .chip .g-coh { fill: #EBDDF5; stroke: #B58BD6; }
[data-theme="pink"] .chip .g-io { fill: #FBE8E3; stroke: #E9A48F; }
[data-theme="pink"] .chip .g-misc { fill: #F4F2DF; stroke: #CBC28E; }
[data-theme="pink"] .chip .sram-ln { stroke: #7E55A0; stroke-opacity: .1; }
[data-theme="pink"] .chip .dl { fill: #37352F; }
[data-theme="pink"] .chip .ds, [data-theme="pink"] .chip .gname { fill: #6B6964; }
[data-theme="pink"] .chip .dblk:hover .b, [data-theme="pink"] .chip .dblk:focus-visible .b { filter: saturate(1.9) brightness(.97); }
[data-theme="pink"] .chip .dblk:focus-visible .b, [data-theme="pink"] .chip .dghost:focus-visible .core-edge { stroke: #37352F; }
[data-theme="pink"] .chip .ext-ln { stroke: var(--trace); }
[data-theme="pink"] .chip .ah-chip-p { fill: var(--trace); }
[data-theme="pink"] .chip .ext:hover .ext-t { fill: var(--trace); }
[data-theme="pink"] .chip-legend .sw.g-fe { background: #D2E9F9 !important; border-color: #7FB3DE !important; }
[data-theme="pink"] .chip-legend .sw.g-ooo { background: #E3F2E3 !important; border-color: #8CC690 !important; }
[data-theme="pink"] .chip-legend .sw.g-fp { background: #FFDFE3 !important; border-color: #F28A9B !important; }
[data-theme="pink"] .chip-legend .sw.g-lsu { background: #DFF8FA !important; border-color: #7ACAD2 !important; }
[data-theme="pink"] .chip-legend .sw.g-sram { background: #DFDDFB !important; border-color: #A99BE0 !important; }
[data-theme="pink"] .chip-legend .sw.g-coh { background: #EBDDF5 !important; border-color: #B58BD6 !important; }
[data-theme="pink"] .chip-legend .sw.g-io { background: #FBE8E3 !important; border-color: #E9A48F !important; }
[data-theme="pink"] .chip-legend .sw.g-misc { background: #F4F2DF !important; border-color: #CBC28E !important; }

/* Semiconductor industry stack (bottom of the home page) */
.stack-fig { margin: 0 0 56px; }
.stack-fig h2 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: -0.01em; }
.stack-cap { margin: 0 0 16px; color: var(--muted); font-size: .95rem; }
.stack { list-style: none; margin: 0 auto; padding: 0; max-width: 940px; }
.layer { --edge: var(--pad); position: relative; display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; align-items: center; gap: 6px 14px;
  margin: 0 calc((var(--n) - var(--d)) * 1.6%) 4px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--edge);
  border-radius: 4px; box-shadow: 0 3px 0 -1px var(--rule); transition: background .15s, transform .15s; }
.layer.sys { --edge: var(--accent-red); }
.layer.design { --edge: var(--trace); }
.layer:not(.nolink):hover, .layer:focus-within { background: var(--trace-soft); transform: translateY(-1px); }
.layer .lvl { font-family: var(--mono); font-size: .85rem; color: var(--muted); text-align: right; }
.lyr-name { font-weight: 600; color: var(--ink); text-decoration: none; }
a.lyr-name::after { content: ""; position: absolute; inset: 0; border-radius: 4px; }
.lyr-name:focus-visible { outline: none; }
.layer:has(.lyr-name:focus-visible) { outline: 2px solid var(--pad); outline-offset: 2px; }
.lyr-cap { display: block; color: var(--muted); font-size: .86rem; }
.lyr-cos { display: block; color: var(--ink); font-size: .8rem; opacity: .8; margin-top: 2px; }
.lyr-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.lyr-size { font-family: var(--mono); font-size: 1rem; font-weight: 500; color: var(--edge); }
.lyr-more { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.lyr-more:empty { display: none; }
.lyr-more a { position: relative; z-index: 1; text-decoration: none; color: var(--ink); background: var(--trace-soft); border-radius: 3px; padding: 3px 9px; font-size: .84rem; }
.lyr-more a:hover { background: var(--trace); color: var(--surface); }
.stack-key { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; margin: 12px 0 0; font-size: .86rem; color: var(--muted); }
.stack-key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--pad); }
.stack-key i.sys { background: var(--accent-red); }
.stack-key i.design { background: var(--trace); }
.stack-src { max-width: 940px; margin: 10px auto 0; font-size: .8rem; color: var(--muted); text-align: center; }
@media (max-width: 640px) {
  .layer { grid-template-columns: 1.4em minmax(0, 1fr); margin-inline: calc((var(--n) - var(--d)) * .8%); }
  .lyr-side { grid-column: 2; align-items: flex-start; }
  .lyr-more { justify-content: flex-start; }
}

@media (max-width: 860px) {
  .floor { grid-template-columns: 1fr; grid-template-areas: "fab" "circ" "isa" "pipe" "core" "mem" "ctr" "coh" "icx" "os" "comp" "conc" "perf" "eda" "verif" "nn" "gen" "llm" "intv" "p1" "p2"; }
  .intro { padding-top: 32px; }
  .page { grid-template-columns: 1fr; gap: 0; padding-top: 16px; }
  .menu-btn.show { display: inline-block; }
  .side { display: none; position: static; max-height: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; margin-bottom: 20px; }
  .side.open { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* LaTeX-style math (MathJax SVG) */
.body .math { margin: 4px 0 18px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.body .math mjx-container[display="true"] { margin: 0 !important; }
.body mjx-container { color: var(--ink); }
.prob .math { margin: 6px 0 12px; overflow-x: auto; overflow-y: hidden; }
