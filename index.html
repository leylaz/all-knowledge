<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  /* Dark by default; a saved choice from the header switch wins. */
  (function () { var t = "dark"; try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark"); })();
</script>
<style>
:root {
  --paper: #F3F5F9; --surface: #FFFFFF; --ink: #121A27; --muted: #566278;
  --rule: #D4DBE6; --trace: #1F4E9C; --trace-soft: #E2EAF7; --pad: #A97F16;
  --pad-soft: #F7EFD9; --code-bg: #E8EDF5; --code-comment: #2B7A4B; --redirect: #B5322E;
  --accent-red: #B5322E; --accent-green: #1F7A57;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #080D14; --surface: #0F1723; --ink: #E4EBF4; --muted: #95A4B8;
    --rule: #223249; --trace: #7FA8F0; --trace-soft: #16243B; --pad: #D1AE55;
    --pad-soft: #1B1810; --code-bg: #0C1420; --code-comment: #6FCB98; --redirect: #EE6B6B;
    --accent-red: #EE6B6B; --accent-green: #4FC28F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #080D14; --surface: #0F1723; --ink: #E4EBF4; --muted: #95A4B8;
  --rule: #223249; --trace: #7FA8F0; --trace-soft: #16243B; --pad: #D1AE55;
  --pad-soft: #1B1810; --code-bg: #0C1420; --code-comment: #6FCB98; --redirect: #EE6B6B;
  --accent-red: #EE6B6B; --accent-green: #4FC28F; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--trace); }
:focus-visible { outline: 2px solid var(--pad); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

header.top { border-bottom: 1px solid var(--rule); background: var(--paper); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.menu-btn { display: none; font: inherit; font-size: .92rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.search { margin-left: auto; flex: 1 1 200px; max-width: 320px; }
.search input { width: 100%; font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; }
.search input::placeholder { color: var(--muted); }

.intro { padding: 48px 0 28px; }
.intro h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.02; letter-spacing: -0.035em; margin: 0 0 12px; font-weight: 700; }
.intro p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 1.05rem; }

.die { border: 2px dashed var(--pad); padding: 14px; border-radius: 4px; margin-bottom: 56px; }
.floor { display: grid; gap: 10px; grid-template-columns: repeat(6, 1fr);
  grid-template-areas:
    "fab fab fab fab fab fab"
    "circ circ circ . . ."; }
.block { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--trace); border-radius: 3px; padding: 16px 18px 18px; transition: opacity .2s; }
.block.dim { opacity: .35; }
.floor .block:nth-child(4n+2) { border-top-color: var(--accent-green); }
.floor .block:nth-child(4n+3) { border-top-color: var(--accent-red); }
.floor .block:nth-child(4n+4) { border-top-color: var(--pad); }
.block h2 { margin: 0 0 2px; font-size: 1.15rem; letter-spacing: -0.01em; }
.block h2 a { color: var(--ink); text-decoration: none; }
.block h2 a:hover { color: var(--trace); }
.block .cap { margin: 0 0 12px; color: var(--muted); font-size: .88rem; }
.block ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.block li a { display: inline-block; text-decoration: none; color: var(--ink); background: var(--trace-soft); border-radius: 3px; padding: 5px 10px; font-size: .92rem; }
.block li a:hover { background: var(--trace); color: var(--surface); }
.block li.hide { display: none; }
.empty { color: var(--muted); margin: -36px 0 48px; }

/* Page layout with side menu */
.page { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; padding-top: 28px; padding-bottom: 64px; }
.side { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; font-size: .92rem; padding-right: 4px; }
.side .grp { margin-bottom: 16px; }
.side .rg { display: block; font-weight: 600; color: var(--ink); text-decoration: none; padding: 4px 8px; border-left: 2px solid var(--rule); }
.side ul { list-style: none; margin: 2px 0 0; padding: 0; }
.side li a { display: block; color: var(--muted); text-decoration: none; padding: 3px 8px 3px 18px; border-left: 2px solid var(--rule); }
.side a:hover { color: var(--trace); }
.side a.cur { color: var(--trace); border-left-color: var(--trace); font-weight: 600; }
.side .subsec { margin: 2px 0 6px; }
.side .subsec li a { padding-left: 32px; font-size: .86rem; }
.side .subsec li.grp-label { padding: 8px 8px 2px 32px; border-left: 2px solid var(--rule); font-size: .74rem; font-weight: 600; color: var(--muted); }
.toc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: -8px 0 28px; font-size: .9rem; }
.toc span { color: var(--muted); }
.toc a { text-decoration: none; background: var(--trace-soft); color: var(--ink); border-radius: 3px; padding: 4px 10px; }
.toc a:hover { background: var(--trace); color: var(--surface); }
.practice { scroll-margin-top: 16px; }
.body h3[id] { scroll-margin-top: 16px; }
.side .home { display: block; margin-bottom: 18px; text-decoration: none; }

.note { max-width: 70ch; min-width: 0; }
.region { color: var(--trace); font-weight: 600; font-size: .95rem; margin: 0 0 6px; }
.note h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 24px; }
.body { font-family: var(--serif); font-size: 1.06rem; line-height: 1.68; }
.body h3 { font-family: var(--sans); font-size: 1.05rem; margin: 30px 0 6px; letter-spacing: -0.005em; }
.body p { margin: 0 0 14px; }
.body .eq { font-family: var(--sans); font-size: 1.02rem; background: var(--code-bg); border-radius: 4px; padding: 10px 14px; margin: 0 0 14px; overflow-x: auto; line-height: 1.3; white-space: nowrap; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 4px; }
.frac > span { padding: 1px 4px; }
.frac > span:first-child { border-bottom: 1px solid currentColor; }
.body ul, .body ol { padding-left: 1.2em; margin: 0 0 14px; }
.body .refs { font-family: var(--sans); font-size: .86rem; color: var(--muted); }
.body h4 { font-family: var(--sans); font-size: .98rem; margin: 24px 0 6px; }
.body h4[id] { scroll-margin-top: 16px; }
.bookref { font-size: .86rem; color: var(--muted); margin: -12px 0 24px; }
.body .callout { font-family: var(--sans); font-size: .93rem; line-height: 1.55; background: var(--trace-soft); border-left: 3px solid var(--trace); border-radius: 3px; padding: 10px 14px; margin: 0 0 16px; }
.body li { margin-bottom: 6px; }
.body code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.body pre { background: var(--code-bg); padding: 14px 16px; border-radius: 4px; overflow-x: auto; font-size: .84rem; line-height: 1.55; margin: 0 0 16px; }
.body pre code { background: none; padding: 0; font-size: inherit; }
.body pre code .cm { color: var(--code-comment); }
.tbl { overflow-x: auto; margin: 0 0 16px; }
.body table { border-collapse: collapse; font-family: var(--sans); font-size: .9rem; width: 100%; }
.body th, .body td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.body th { font-weight: 600; }

/* Practice */
.practice { background: var(--pad-soft); border: 1px solid var(--pad); border-radius: 4px; padding: 18px 20px 6px; margin: 40px 0 36px; }
.practice > h2 { margin: 0 0 4px; font-size: 1.15rem; }
.practice > p { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
.practice h3 { font-size: .98rem; margin: 18px 0 8px; }
.prob { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; margin-bottom: 12px; }
.prob .q { font-family: var(--serif); font-size: 1rem; line-height: 1.6; }
.prob .q p { margin: 0 0 8px; }
.prob details { margin-top: 6px; }
.prob summary { cursor: pointer; color: var(--trace); font-weight: 600; font-size: .92rem; }
.prob .a { font-family: var(--serif); font-size: .98rem; line-height: 1.62; padding-top: 8px; }
.prob .a p { margin: 0 0 10px; }
.prob .a ol, .prob .a ul { padding-left: 1.2em; margin: 0 0 10px; }
.prob code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.prob pre { background: var(--code-bg); padding: 10px 12px; border-radius: 4px; overflow-x: auto; font-size: .82rem; }
.prob pre code { background: none; padding: 0; }
.prob .qn { font-family: var(--sans); font-size: .8rem; font-weight: 700; color: var(--pad); letter-spacing: .04em; margin: 0 0 4px; }
.prob .lvl { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 10px; font-size: .72rem; font-weight: 600; letter-spacing: 0; border: 1px solid currentColor; vertical-align: 1px; }
.prob .lvl.easy { color: var(--accent-green); }
.prob .lvl.medium { color: var(--trace); }
.prob .lvl.hard { color: var(--accent-red); }
.body .prob { margin-bottom: 14px; }

.pager { display: flex; justify-content: space-between; gap: 16px; border-top: 1px solid var(--rule); margin-top: 40px; padding-top: 18px; font-size: .95rem; }
.pager a { text-decoration: none; }
.pager .next { margin-left: auto; text-align: right; }
.pager small { display: block; color: var(--muted); font-size: .8rem; }
.sublist { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 24px; padding: 0; list-style: none; }
.sublist a { display: inline-block; text-decoration: none; color: var(--ink); background: var(--trace-soft); border-radius: 3px; padding: 5px 10px; font-size: .92rem; font-family: var(--sans); }


/* Header theme switch */
.theme-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .88rem; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
.theme-btn:hover { border-color: var(--trace); color: var(--trace); }
.theme-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 860px) {
  .floor { grid-template-columns: 1fr; grid-template-areas: "fab" "circ"; }
  .intro { padding-top: 32px; }
  .page { grid-template-columns: 1fr; gap: 0; padding-top: 16px; }
  .menu-btn.show { display: inline-block; }
  .side { display: none; position: static; max-height: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; margin-bottom: 20px; }
  .side.open { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* LaTeX-style math (MathJax SVG) */
.body .math { margin: 4px 0 18px; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.body .math mjx-container[display="true"] { margin: 0 !important; }
.body mjx-container { color: var(--ink); }
.prob .math { margin: 6px 0 12px; overflow-x: auto; overflow-y: hidden; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">All Knowledge</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">All sections</button>
    <div class="search"><input id="q" type="search" placeholder="Search notes" aria-label="Search notes"></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
  </div>
</header>
<main id="app"></main>

<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
  svg: { fontCache: "global" },
  startup: { typeset: false, ready: function () { MathJax.startup.defaultReady(); MathJax.startup.promise.then(function () { if (window.typesetMath) window.typesetMath(); }); } }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="js/site.js"></script>
<script src="sections/fab.js"></script>
<script src="sections/circ.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
